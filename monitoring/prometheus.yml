global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: load-balancer
    static_configs:
      - targets: [load-balancer:8000]

  - job_name: master
    static_configs:
      - targets: [master:8001]

  - job_name: rag-retriever
    static_configs:
      - targets: [rag-retriever:8002]

  - job_name: ingestion-service
    static_configs:
      - targets: [ingestion-service:8003]

  # Swarm service discovery — auto-finds all worker task IPs across nodes.
  # Requires /var/run/docker.sock mounted into Prometheus container.
  - job_name: workers
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        filters:
          - name: service
            values: [inference_worker]
    relabel_configs:
      # Drop tasks that are not running
      - source_labels: [__meta_dockerswarm_task_desired_state]
        action: keep
        regex: running
      # Use the task's overlay IP + metrics port 8080
      - source_labels: [__meta_dockerswarm_task_address]
        target_label: __address__
        replacement: "${1}:8080"
      # Expose slot number as label
      - source_labels: [__meta_dockerswarm_task_slot]
        target_label: worker_slot
