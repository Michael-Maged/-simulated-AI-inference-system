global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: load-balancer
    static_configs:
      - targets: [load-balancer:8000]

  - job_name: master
    static_configs:
      - targets: [master:8001]

  - job_name: rag-retriever
    static_configs:
      - targets: [rag-retriever:8002]

  - job_name: ingestion-service
    static_configs:
      - targets: [ingestion-service:8003]

  - job_name: workers
    static_configs:
      - targets:
          - worker-1:8080
          - worker-2:8080
          - worker-3:8080
          - worker-4:8080
