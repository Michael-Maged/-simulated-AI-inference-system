global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: load-balancer
    static_configs:
      - targets: [load-balancer:8000]

  - job_name: master
    static_configs:
      - targets: [master:8001]

  - job_name: rag-retriever
    static_configs:
      - targets: [rag-retriever:8002]

  - job_name: ingestion-service
    static_configs:
      - targets: [ingestion-service:8003]

  - job_name: workers
    dns_sd_configs:
      - names: [tasks.inference_worker]
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: workers-node2
    static_configs:
      - targets:
          - 192.168.1.231:8089
          - 192.168.1.231:8090
          - 192.168.1.231:8091
          - 192.168.1.231:8092
          - 192.168.1.231:8093
          - 192.168.1.231:8094
          - 192.168.1.231:8095
          - 192.168.1.231:8096

  - job_name: workers-node3
    static_configs:
      - targets:
          - 192.168.1.151:8097
          - 192.168.1.151:8098
          - 192.168.1.151:8099
          - 192.168.1.151:8100
          - 192.168.1.151:8101
          - 192.168.1.151:8102
          - 192.168.1.151:8103
          - 192.168.1.151:8104

  - job_name: workers-node4
    static_configs:
      - targets:
          - 192.168.1.152:8105
          - 192.168.1.152:8106
          - 192.168.1.152:8107
          - 192.168.1.152:8108
          - 192.168.1.152:8109
          - 192.168.1.152:8110
          - 192.168.1.152:8111
          - 192.168.1.152:8112
